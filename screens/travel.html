<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel - UBERx SpaceX</title>
    <link rel="stylesheet" href="../style/apps.css">
    <link rel="stylesheet" href="../style/travel.css">
</head>
<body>
    <div class="app-container">

        <input type="checkbox" id="sheet-toggle" class="ctrl">
        <input type="radio" name="ship" id="ship-1" class="ctrl" checked>
        <input type="radio" name="ship" id="ship-2" class="ctrl">
        <input type="radio" name="ship" id="ship-3" class="ctrl">
        <input type="checkbox" id="swipe-confirm" class="ctrl">

        <main class="travel">

            <section class="map-view">
                <!-- ✅ back → home.html -->
                <a href="home.html" class="back-btn">&#8249;</a>
            </section>

            <section class="bottom-sheet">

                <label for="sheet-toggle" class="drag"></label>
                <p class="notice">Fares are higher due to space debris</p>

                <ul class="ship-list">
                    <li>
                        <label for="ship-1" class="ship">
                            <img src="../archive/nave1_sin_fondo.png" alt="Crew Dragon">
                            <div class="info">
                                <h3>Crew Dragon</h3>
                                <p>Next Launch: 12/03/53, 19:30</p>
                            </div>
                            <span class="price">48.5 <i class="coin"></i></span>
                        </label>
                    </li>
                    <li>
                        <label for="ship-2" class="ship">
                            <img src="../archive/nave2_sin_fondo.png" alt="Starliner">
                            <div class="info">
                                <h3>Starliner</h3>
                                <p>Next Launch: 24/03/53, 12:30</p>
                            </div>
                            <span class="price">51.2 <i class="coin"></i></span>
                        </label>
                    </li>
                    <li>
                        <label for="ship-3" class="ship">
                            <img src="../archive/nave3_sin_fondo.png" alt="Dream Chaser">
                            <div class="info">
                                <h3>Dream Chaser</h3>
                                <p>Next Launch: 24/03/53, 12:30</p>
                            </div>
                            <span class="price">102.5 <i class="coin"></i></span>
                        </label>
                    </li>
                </ul>

                <!-- ✅ Connect Wallet → payment-methods.html -->
                <a href="payment-methods.html" class="wallet">
                    <span class="wallet-icon">✦</span>
                    <span class="wallet-label">Connect Wallet</span>
                    <span class="wallet-arrow">›</span>
                </a>

                <!-- ✅ Swipe → booking.html -->
                <a href="booking.html" class="swipe">
                    <span class="swipe-thumb">›</span>
                    <span class="swipe-text">Swipe To Confirm Your Booking</span>
                </a>

            </section>
        </main>
    </div>
</body>
</html>
