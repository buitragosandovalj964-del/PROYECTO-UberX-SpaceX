<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Receipt - UBERx SpaceX</title>
    <link rel="stylesheet" href="/style/apps.css">
    <link rel="stylesheet" href="/style/receipt.css">
</head>
<body>
    <div class="app-container">
        <main class="receipt-screen">

            <!-- HEADER -->
            <header class="receipt-header">
                <a href="booking.html" class="back-btn" aria-label="Go back">&#8249;</a>
                <h1 class="receipt-title">Receipt</h1>
                <span class="header-spacer"></span>
            </header>

            <!-- CARD PRINCIPAL -->
            <div class="receipt-scroll">
                <div class="receipt-card">

                    <!-- Importe -->
                    <div class="receipt-amount">
                        <span class="amount-value">$859.50</span>
                        <span class="amount-label">Airline Name</span>
                        <span class="amount-date">15th Oct 2024, 08:15 AM</span>
                    </div>

                    <div class="divider"></div>

                    <!-- Flight Details -->
                    <div class="section-title">Flight Details</div>

                    <div class="flight-row">
                        <div class="flight-origin">
                            <span class="flight-icon">✈</span>
                            <span class="flight-code">JFK</span>
                            <span class="flight-time">10:30 AM</span>
                        </div>
                        <div class="flight-arrow">→</div>
                        <div class="flight-dest">
                            <span class="flight-code">LAX</span>
                            <span class="flight-time">01:45 PM</span>
                            <span class="flight-icon flight-icon--land">🛬</span>
                        </div>
                    </div>

                    <div class="detail-row">
                        <span class="detail-label">Flight Number</span>
                        <span class="detail-value">AN123</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Seat</span>
                        <span class="detail-value">24A</span>
                    </div>

                    <div class="divider"></div>

                    <div class="detail-row">
                        <span class="detail-label">Fare</span>
                        <span class="detail-value">$780.00</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Taxes & Fees</span>
                        <span class="detail-value">$79.50</span>
                    </div>
                    <div class="detail-row detail-row--total">
                        <span class="detail-label">Total</span>
                        <span class="detail-value detail-value--accent">$859.50</span>
                    </div>

                    <div class="divider"></div>

                    <!-- Payment & Category -->
                    <div class="detail-row">
                        <div class="detail-label-icon">
                            <span class="meta-icon">💳</span>
                            <span class="detail-label">Payment Method</span>
                        </div>
                        <span class="detail-value detail-value--dim">Amex ···· 5678</span>
                    </div>
                    <div class="detail-row">
                        <div class="detail-label-icon">
                            <span class="meta-icon">🏷</span>
                            <span class="detail-label">Category</span>
                        </div>
                        <span class="category-badge">Travel</span>
                    </div>

                </div>
            </div>

            <!-- FOOTER ACCIONES -->
            <footer class="receipt-footer">
                <button class="footer-btn" aria-label="Share">
                    <span class="footer-icon">
                        <!-- Share icon SVG -->
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/>
                            <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>
                        </svg>
                    </span>
                    <span class="footer-label">Share</span>
                </button>
                <button class="footer-btn" aria-label="Download">
                    <span class="footer-icon">
                        <!-- Download icon SVG -->
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                            <polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
                        </svg>
                    </span>
                    <span class="footer-label">Download</span>
                </button>
                <button class="footer-btn" aria-label="Categorize">
                    <span class="footer-icon">
                        <!-- Edit/Categorize icon SVG -->
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>
                        </svg>
                    </span>
                    <span class="footer-label">Categorize</span>
                </button>
            </footer>

        </main>
    </div>
</body>
</html>
