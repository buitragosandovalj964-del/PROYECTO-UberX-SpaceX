<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - UBERx SpaceX</title>
    <link rel="stylesheet" href="../style/apps.css">
    <link rel="stylesheet" href="../style/home.css">
</head>
<body>
    <div class="app-container">
        <div class="home">

            <header class="home__header">
                <div class="home__user">
                    <img src="../archive/26d8d3b982f2426e333b0411cf044c29.jpg" alt="Profile" class="home__avatar">
                    <h1 class="home__name">William Teig</h1>
                </div>

                <section class="home__banner">
                    <div class="home__banner-info">
                        <h2 class="home__banner-title">Always Wear Your Helmet</h2>
                        <p class="home__banner-subtitle">When Traveling In Space</p>
                        <a href="#" class="home__banner-link">About Safe Space Flight &gt;</a>
                    </div>
                    <img src="../archive/astronauta_sin_fondo.png" alt="Astronaut" class="home__banner-img">
                </section>
            </header>

            <!-- Acciones rápidas -->
            <nav class="home__actions">
                <a href="travel.html" class="action-btn">
                    <img src="../archive/cohete_sin_fondo.png" alt="" class="action-btn__icon">
                    <span class="action-btn__label">Travel</span>
                </a>
                <a href="#" class="action-btn">
                    <img src="../archive/planeta_sin_fondo.png" alt="" class="action-btn__icon">
                    <span class="action-btn__label">Explore</span>
                </a>
                <a href="booking.html" class="action-btn">
                    <img src="../archive/astronauta2_sin_fondo.png" alt="" class="action-btn__icon">
                    <span class="action-btn__label">Book</span>
                </a>
            </nav>

            <!-- Buscador -->
            <section class="home__search">
                <div class="search-box">
                    <span class="search-box__icon">🔍</span>
                    <input type="search" class="search-box__input" placeholder="Where to...?">
                    <button class="search-box__history">
                        <span>🕒</span> Now ▾
                    </button>
                </div>
            </section>

            <!-- Lista de destinos — HTML corregido -->
            <section class="home__destinations">
                <ul class="destinations-list">

                    <li class="destination">
                        <img src="../archive/tierra_sin_fondo.png" alt="Earth" class="destination__img">
                        <div class="destination__info">
                            <strong class="destination__name">Earth</strong>
                            <span class="destination__sub">Solar System, Planet 4</span>
                        </div>
                    </li>

                    <li class="destination">
                        <img src="../archive/marte_sin_fondo.png" alt="Mars" class="destination__img">
                        <div class="destination__info">
                            <strong class="destination__name">Mars</strong>
                            <span class="destination__sub">Solar System, Planet 5</span>
                        </div>
                    </li>

                    <li class="destination">
                        <img src="../archive/satelite_sin_fondo.png" alt="Satelite" class="destination__img">
                        <div class="destination__info">
                            <strong class="destination__name">Satelite</strong>
                            <span class="destination__sub">International Space Station</span>
                        </div>
                    </li>

                    <li class="destination">
                        <img src="../archive/luna_sin_fondo.png" alt="Moon" class="destination__img">
                        <div class="destination__info">
                            <strong class="destination__name">Moon</strong>
                            <span class="destination__sub">Solar System, Planet 3</span>
                        </div>
                    </li>

                </ul>
            </section>

            <!-- Bottom Nav -->
            <nav class="bottom-nav">
                <a href="home.html" class="bottom-nav__item bottom-nav__item--active" aria-current="page">
                    <span class="bottom-nav__icon">🏠</span>
                    Home
                </a>
                <a href="#" class="bottom-nav__item">
                    <span class="bottom-nav__icon">🛸</span>
                    Journeys
                </a>
            </nav>

        </div>
    </div>
</body>
</html>
