<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Methods</title>
    <!-- ✅ Sin librerías externas — solo CSS propio -->
    <link rel="stylesheet" href="../style/apps.css">
    <link rel="stylesheet" href="../style/Payment.css">
</head>
<body>
<div class="app-container payment-screen">

    <header class="app-header">
        <!-- back → booking.html -->
        <a href="booking.html" class="back-btn" aria-label="Back">
            <!-- SVG flecha izquierda -->
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="15 18 9 12 15 6"/>
            </svg>
        </a>
        <h1>Payment Methods</h1>
    </header>

    <section class="search-section">
        <div class="search-bar u-glass">
            <!-- SVG lupa -->
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="opacity:0.5;flex-shrink:0;">
                <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
            <input type="search" placeholder="Search payment methods">
        </div>
    </section>

    <main class="payment-list">

        <!-- Tarjeta 1 — Default -->
        <div class="payment-card u-glass" role="button" tabindex="0">
            <div class="card-brand">
                <img src="../archive/tarjetacredi2.jpg" alt="Mastercard">
            </div>
            <div class="card-info">
                <p class="card-number">**** **** **** 1234</p>
                <p class="card-expiry">Expires 12/25</p>
            </div>
            <div class="card-badges">
                <span class="badge-default">Default</span>
            </div>
            <div class="card-actions">
                <!-- SVG tres puntos -->
                <button class="btn-icon" aria-label="More options">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                        <circle cx="12" cy="5" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="19" r="1.5"/>
                    </svg>
                </button>
            </div>
        </div>

        <!-- Tarjeta 2 -->
        <div class="payment-card u-glass" role="button" tabindex="0">
            <div class="card-brand">
                <img src="../archive/credito-black.jpg" alt="Card">
            </div>
            <div class="card-info">
                <p class="card-number">**** **** **** 5678</p>
                <p class="card-expiry">Expires 01/26</p>
            </div>
            <div class="card-actions">
                <!-- SVG lápiz -->
                <button class="btn-icon" aria-label="Edit">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                        <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
                    </svg>
                </button>
                <!-- SVG papelera -->
                <button class="btn-icon btn-delete" aria-label="Delete">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="3 6 5 6 21 6"/>
                        <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
                        <path d="M10 11v6"/><path d="M14 11v6"/>
                        <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>
                    </svg>
                </button>
            </div>
        </div>

        <!-- PayPal -->
        <div class="payment-card u-glass" role="button" tabindex="0">
            <div class="card-brand">
                <img src="../archive/{5C84223E-65F8-420C-BE5B-D1BC94310AF9}.png" alt="PayPal">
            </div>
            <div class="card-info">
                <p class="card-name">PayPal</p>
            </div>
            <div class="card-actions">
                <button class="btn-icon" aria-label="Edit">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                        <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
                    </svg>
                </button>
                <button class="btn-icon btn-delete" aria-label="Delete">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="3 6 5 6 21 6"/>
                        <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
                        <path d="M10 11v6"/><path d="M14 11v6"/>
                        <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>
                    </svg>
                </button>
            </div>
        </div>

    </main>

    <footer class="footer-cta">
        <!-- Decorativo, no navega -->
        <button class="btn-primary-wide">Add New Method</button>
    </footer>

</div>
</body>
</html>
